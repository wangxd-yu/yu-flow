# 生产 profile：只放与默认配置不同的项，所有口令 / 密钥一律从环境变量读取，不在仓库里出现真实值。
# 缺少必填环境变量时启动直接失败，这是有意的（宁可起不来，不要带着空口令跑）。
#
# 必填：SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#       YU_FLOW_ADMIN_PASSWORD / YU_FLOW_JWT_SECRET / YU_FLOW_AES_SECRET（16/24/32 字节）
# 建议：YU_FLOW_CURRENT_ENV=PROD、YU_FLOW_RELEASE_SIGNING_KEY、YU_FLOW_LOCK_ASSET_EDITING=true
#       YU_FLOW_SM2_PRIVATE_KEY / YU_FLOW_SM2_PUBLIC_KEY（多节点必须固定）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.highgo.jdbc.Driver}

yu:
  flow:
    password: ${YU_FLOW_ADMIN_PASSWORD}
    security:
      jwt-secret-key: ${YU_FLOW_JWT_SECRET}
      aes-secret-key: ${YU_FLOW_AES_SECRET}
      # 以下三项是历史上的放松档位，保留为可覆盖的默认值；生产建议依次改为 true / false / false
      fail-on-insecure-defaults: ${YU_FLOW_FAIL_ON_INSECURE_DEFAULTS:false}
      allow-yml-admin-fallback: ${YU_FLOW_ALLOW_YML_ADMIN_FALLBACK:true}
      allow-ingress-auth-none: ${YU_FLOW_ALLOW_INGRESS_AUTH_NONE:true}
