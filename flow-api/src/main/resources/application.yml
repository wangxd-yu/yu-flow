server:
  port: 11281
  servlet:
    context-path: /flow
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/flow?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # 禁止将真实口令写入仓库；本地可设环境变量或复制 application-local.yml.example
    password: ${SPRING_DATASOURCE_PASSWORD:}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0

# yu-flow Unified Configuration
yu:
  flow:
    enabled: true
    enable-ui: true
    username: ${YU_FLOW_ADMIN_USERNAME:admin}
    # 引导管理员口令：必须通过环境变量注入，勿使用弱默认
    password: ${YU_FLOW_ADMIN_PASSWORD:}
    demo-mode: ${YU_FLOW_DEMO_MODE:false}
    demo:
      max-steps: 200
      max-for-loop-items: 50
    # 宿主同名演示接口 /yu-demo/**；默认关闭，本地验收 WRAP 时显式开启
    host-demo:
      enabled: ${YU_FLOW_HOST_DEMO_ENABLED:false}
    engine:
      expression-engine: simple
      strict-mode: true
      enable-trace: false
      groovy-script-cache-size: ${YU_FLOW_GROOVY_CACHE_SIZE:256}
      definition-cache-max-size: ${YU_FLOW_DEFINITION_CACHE_SIZE:256}
      definition-cache-expire-minutes: ${YU_FLOW_DEFINITION_CACHE_EXPIRE_MINUTES:60}
      pool-core-size: ${YU_FLOW_ENGINE_POOL_CORE:0}
      pool-max-size: ${YU_FLOW_ENGINE_POOL_MAX:0}
      pool-queue-capacity: ${YU_FLOW_ENGINE_POOL_QUEUE:1024}
      for-max-in-flight: ${YU_FLOW_FOR_MAX_IN_FLIGHT:64}
      resolved-content-cache-max-size: ${YU_FLOW_RESOLVED_CONTENT_CACHE:256}
    security:
      # 无不安全默认值：必须设置环境变量；本地见 application-local.yml.example
      aes-secret-key: ${YU_FLOW_AES_SECRET:}
      jwt-secret-key: ${YU_FLOW_JWT_SECRET:}
      jwt-expire-seconds: ${YU_FLOW_JWT_EXPIRE_SECONDS:7200}
      script-allowed-beans: []
      # 脚本语言白名单；groovy / python 逃逸面较大，需显式加入（逗号分隔）
      script-allowed-languages: ${YU_FLOW_SCRIPT_ALLOWED_LANGUAGES:aviator,spel,javascript,groovy}
      fail-on-insecure-defaults: ${YU_FLOW_FAIL_ON_INSECURE_DEFAULTS:true}
      block-private-outbound: ${YU_FLOW_BLOCK_PRIVATE_OUTBOUND:true}
      allow-yml-admin-fallback: ${YU_FLOW_ALLOW_YML_ADMIN_FALLBACK:false}
      # 默认禁止接口 authMode=NONE（匿名可调）；仅应急可设 YU_FLOW_ALLOW_INGRESS_AUTH_NONE=true
      allow-ingress-auth-none: ${YU_FLOW_ALLOW_INGRESS_AUTH_NONE:false}
      # HttpRequest 节点 ignoreSsl 总开关；生产建议 false（一刀切禁用跳过证书校验）
      allow-ignore-ssl: ${YU_FLOW_ALLOW_IGNORE_SSL:true}
    task:
      lock-ttl-minutes: ${YU_FLOW_TASK_LOCK_TTL_MINUTES:30}
      lock-renew-interval-seconds: ${YU_FLOW_TASK_LOCK_RENEW_SECONDS:60}
      scheduler-pool-size: ${YU_FLOW_TASK_SCHEDULER_POOL:4}
      async-core-pool-size: ${YU_FLOW_TASK_ASYNC_CORE:4}
      async-max-pool-size: ${YU_FLOW_TASK_ASYNC_MAX:8}
      async-queue-capacity: ${YU_FLOW_TASK_ASYNC_QUEUE:200}
    metrics:
      enabled: true
      include-debug: false
      redis-ttl-hours: 3
      retain-days: 90
      flush-interval-seconds: 30
      flush-lock-ttl-seconds: 55
    open:
      enabled: ${YU_FLOW_OPEN_ENABLED:true}
      entry-prefix: /flow-api/open
      skew-seconds: 300
      allow-plain-secret: ${YU_FLOW_OPEN_ALLOW_PLAIN_SECRET:false}
      rotate-grace-hours: 24
      call-log-enabled: true
      include-body-hash: true
      nonce-fail-closed: ${YU_FLOW_OPEN_NONCE_FAIL_CLOSED:true}
      allow-direct-path: ${YU_FLOW_OPEN_ALLOW_DIRECT_PATH:false}
      require-host-auth: ${YU_FLOW_OPEN_REQUIRE_HOST_AUTH:true}
    ingress:
      enabled: ${YU_FLOW_INGRESS_ENABLED:true}
      default-auth-mode: ${YU_FLOW_INGRESS_DEFAULT_AUTH_MODE:HOST}
      default-anti-replay: ${YU_FLOW_INGRESS_DEFAULT_ANTI_REPLAY:true}
      default-rate-limit-enabled: ${YU_FLOW_INGRESS_DEFAULT_RATE_LIMIT_ENABLED:false}
      default-rate-limit-qps: ${YU_FLOW_INGRESS_DEFAULT_RATE_LIMIT_QPS:100}
      default-ip-allowlist: ${YU_FLOW_INGRESS_DEFAULT_IP_ALLOWLIST:}
      default-timeout-ms: ${YU_FLOW_INGRESS_DEFAULT_TIMEOUT_MS:30000}
      rate-limit-fail-open: ${YU_FLOW_INGRESS_RATE_LIMIT_FAIL_OPEN:true}
    mail:
      enabled: ${YU_FLOW_MAIL_ENABLED:false}
      host: ${YU_FLOW_MAIL_HOST:}
      port: ${YU_FLOW_MAIL_PORT:465}
      username: ${YU_FLOW_MAIL_USERNAME:}
      password: ${YU_FLOW_MAIL_PASSWORD:}
      from: ${YU_FLOW_MAIL_FROM:}
      ssl: ${YU_FLOW_MAIL_SSL:true}
      starttls: ${YU_FLOW_MAIL_STARTTLS:false}
