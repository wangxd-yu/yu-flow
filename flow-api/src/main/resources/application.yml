# yu-flow Unified Configuration
yu:
  flow:
    enabled: true
    enable-ui: true
    username: admin
    password: ${YU_FLOW_ADMIN_PASSWORD:123456}
    # 演示模式开关（默认关闭）
    # 开启后：系统预置资产（API/模型/目录/数据源）将被只读锁定，Flow 引擎内的数据库写操作将被拦截
    # 部署演示环境时设为 true（可通过环境变量注入：YU_FLOW_DEMO_MODE=true）
    demo-mode: ${YU_FLOW_DEMO_MODE:false}
    # 演示模式安全限制（仅 demo-mode=true 时生效）
    demo:
      # 单次流程执行允许的最大步骤数（防死循环），超过后强制终止
      max-steps: 200
      # For 循环节点允许的最大输入数组元素数（防线程池耗尽）
      max-for-loop-items: 50
    # Flow Engine Group
    engine:
      expression-engine: simple
      strict-mode: true
      enable-trace: false
      # Groovy 编译类缓存上限，防止不同脚本持续占用 Metaspace
      groovy-script-cache-size: ${YU_FLOW_GROOVY_CACHE_SIZE:256}
    # Security Group
    security:
      aes-secret-key: ${YU_FLOW_AES_SECRET:flow-secure-keys}
      # Groovy 脚本允许通过 spring.getBean(name) 访问的 Bean 名称，默认不开放
      script-allowed-beans: []
    # 定时任务
    task:
      # Cron 分布式执行锁 TTL（分钟），多节点下同一任务同时仅允许一个实例执行
      lock-ttl-minutes: ${YU_FLOW_TASK_LOCK_TTL_MINUTES:30}
