server:
  port: 11281
  servlet:
    context-path: /flow
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/flow?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:YuXin@1823}
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0

# yu-flow Unified Configuration
yu:
  flow:
    enabled: true
    enable-ui: true
    username: admin
    password: ${YU_FLOW_ADMIN_PASSWORD:123456}
    # 演示模式开关（默认关闭）
    # 开启后：系统预置资产（API/模型/目录/数据源）将被只读锁定，Flow 引擎内的数据库写操作将被拦截
    # 部署演示环境时设为 true（可通过环境变量注入：YU_FLOW_DEMO_MODE=true）
    demo-mode: ${YU_FLOW_DEMO_MODE:true}
    # 演示模式安全限制（仅 demo-mode=true 时生效）
    demo:
      # 单次流程执行允许的最大步骤数（防死循环），超过后强制终止
      max-steps: 200
      # For 循环节点允许的最大输入数组元素数（防线程池耗尽）
      max-for-loop-items: 50
    # Flow Engine Group
    engine:
      expression-engine: simple
      strict-mode: true
      enable-trace: false
    # Security Group
    security:
      aes-secret-key: ${YU_FLOW_AES_SECRET:flow-secure-keys}
