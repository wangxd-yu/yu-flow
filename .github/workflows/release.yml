# 打 v* tag 才触发。构建一体化镜像推到 GHCR，并把可执行 jar、SBOM、建表脚本附到 GitHub Release。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Image, SBOM and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        id: ver
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${{ steps.ver.outputs.version }}"
            if [ "${{ steps.ver.outputs.latest }}" = "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先导出 jar（会构建前端和后端），镜像阶段复用同一份缓存
      - name: Export executable jar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: artifact
          build-args: REVISION=${{ steps.ver.outputs.version }}
          outputs: type=local,dest=release-dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: REVISION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: CycloneDX SBOM
        working-directory: flow-api
        run: mvn -B -DskipTests -Drevision=${{ steps.ver.outputs.version }} org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom

      - name: Collect release files
        run: |
          test -f release-dist/yu-flow-api-exec.jar
          cp flow-api/sql-mysql/00_all_flow_tables.sql release-dist/mysql-00_all_flow_tables.sql
          cp flow-api/sql-mysql/00_system_init.sql release-dist/mysql-00_system_init.sql
          cp flow-api/sql-pg/00_all_flow_tables.sql release-dist/pg-00_all_flow_tables.sql
          cp flow-api/sql-pg/00_system_init.sql release-dist/pg-00_system_init.sql
          cp flow-api/target/bom.json release-dist/bom.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "$(cat <<EOF
          ## 产物

          - \`yu-flow-api-exec.jar\`：可执行包，前端已内嵌，版本 ${{ steps.ver.outputs.version }}
          - \`${{ steps.tags.outputs.image }}:${{ steps.ver.outputs.version }}\`：同一份构建的容器镜像
          - \`bom.json\`：CycloneDX 依赖清单
          - \`mysql-*.sql\` / \`pg-*.sql\`：空库初始化脚本（先建表，再种子）。已有库不要整库重灌

          ## 运行

          镜像内健康检查是 \`/flow/actuator/health\`。Prometheus 需要环境变量 \`YU_FLOW_METRICS_TOKEN\`。
          数据库口令、\`YU_FLOW_JWT_SECRET\`、\`YU_FLOW_AES_SECRET\`、\`YU_FLOW_ADMIN_PASSWORD\` 由环境变量注入，镜像里没有默认口令。
          EOF
          )"
