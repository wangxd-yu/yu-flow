# Yu-Flow 质量门禁 CI
# 后端：mvn clean verify （编译 + 全量单测 + Jacoco 覆盖率门禁检查）
# 前端：pnpm type-check + pnpm build
name: CI

on:
  push:
    branches: [ master, main, 'support/**' ]
  pull_request:
    branches: [ master, main, 'support/**' ]

jobs:
  backend-test:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # pom.xml 中 skipTests 默认 true（本地打包提速）
      # CI 使用 mvn clean verify 而非 mvn test 理由：
      # 1. clean 确保字节码重新编译，避免 Jacoco "class does not match" 接口匹配错误
      # 2. verify 阶段才会触发 jacoco:check 覆盖率门禁（check 绑定在 verify，非 test）
      - name: Build & Test & Coverage Check
        working-directory: flow-api
        run: mvn -B clean verify -DskipTests=false -Dmaven.test.skip=false

      - name: Test Report Summary
        if: always()
        working-directory: flow-api
        run: |
          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            grep -hE "^Tests run" target/surefire-reports/*.txt \
              | awk -F'[:,]' '{t+=$2; f+=$4; e+=$6; s+=$8} END {printf "TOTAL: tests=%d failures=%d errors=%d skipped=%d\n", t, f, e, s}' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage Summary
        if: always()
        working-directory: flow-api
        run: |
          JACOCO_INDEX="target/site/jacoco/jacoco/index.html"
          # 兼容两种输出目录写法
          [ ! -f "$JACOCO_INDEX" ] && JACOCO_INDEX="target/site/jacoco/index.html"
          if [ -f "$JACOCO_INDEX" ]; then
            echo "### JaCoCo Coverage" >> "$GITHUB_STEP_SUMMARY"
            grep -oP 'Total.*?</tfoot>' "$JACOCO_INDEX" \
              | grep -oP '\d+%' \
              | head -2 \
              | awk 'NR==1{print "- Instruction coverage: " $0} NR==2{print "- Branch coverage: " $0}' \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            echo "JaCoCo report not found (tests may have been skipped or failed)" >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: flow-api/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: flow-api/target/site/jacoco/
          retention-days: 7

  frontend-build:
    name: Frontend · pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
          cache-dependency-path: flow-ui/pnpm-lock.yaml

      - name: Install
        working-directory: flow-ui
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        working-directory: flow-ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: flow-ui
        run: pnpm build
